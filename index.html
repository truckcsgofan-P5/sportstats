<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportStats - Fotbal & Hokej Statistiky</title>
    <!-- Tailwind CSS pro moderní vzhled -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen pb-12">

    <!-- Hlavička -->
    <header class="bg-slate-800 border-b border-slate-700 shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-emerald-400">⚽🏒 SportStats</h1>
            <div class="flex items-center gap-4">
                <nav class="space-x-2">
                    <button onclick="switchTab('fotbal')" id="btn-fotbal" class="px-3 py-1.5 bg-emerald-600 rounded-lg text-sm font-semibold transition hover:bg-emerald-500">Fotbal</button>
                    <button onclick="switchTab('hokej')" id="btn-hokej" class="px-3 py-1.5 bg-slate-700 rounded-lg text-sm font-semibold transition hover:bg-slate-600">Hokej</button>
                </nav>
                <button onclick="toggleAdmin()" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-sm rounded-lg font-semibold transition">⚙️ Správa dat</button>
            </div>
        </div>
    </header>

    <!-- Hlavní obsah -->
    <main class="max-w-6xl mx-auto px-4 py-8 space-y-8">

        <!-- FOTBALOVÁ SEKCE -->
        <section id="sec-fotbal" class="space-y-8">
            
            <!-- Výběr lig -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-wrap gap-2 items-center justify-between">
                <span class="text-slate-400 font-semibold text-sm">Vyberte ligu:</span>
                <div id="league-buttons" class="flex flex-wrap gap-2">
                    <!-- Tlačítka se vygenerují sama -->
                </div>
            </div>

            <!-- Název aktivní ligy -->
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-bold text-emerald-400" id="league-title">Načítám...</h2>
            </div>

            <!-- Dva sloupce: Zápasy a Tabulka -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                
                <!-- Zápasy -->
                <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                    <h3 class="text-lg font-bold text-emerald-400 mb-4">📅 Výsledky & Zápasy</h3>
                    <div id="matches-container" class="space-y-3"></div>
                </div>

                <!-- Automaticky počítaná tabulka -->
                <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                    <h3 class="text-lg font-bold text-emerald-400 mb-4">🏆 Tabulka ligy</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm border-collapse">
                            <thead>
                                <tr class="border-b border-slate-700 text-slate-400">
                                    <th class="py-2">Tým</th>
                                    <th class="py-2 text-center">Z</th>
                                    <th class="py-2 text-center">Skóre</th>
                                    <th class="py-2 text-right">Body</th>
                                </tr>
                            </thead>
                            <tbody id="standings-container" class="divide-y divide-slate-700"></tbody>
                        </table>
                    </div>
                </div>

            </div>

            <!-- Top střelci pro danou ligu -->
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                <h3 class="text-lg font-bold text-emerald-400 mb-4">⚽ Top střelci</h3>
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-700 text-slate-400">
                            <th class="py-2">Hráč</th>
                            <th class="py-2">Tým</th>
                            <th class="py-2 text-right">Góly</th>
                        </tr>
                    </thead>
                    <tbody id="scorers-container" class="divide-y divide-slate-700"></tbody>
                </table>
            </div>
        </section>

        <!-- HOKEJOVÁ SEKCE -->
        <section id="sec-hokej" class="space-y-8 hidden">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                <h2 class="text-2xl font-bold text-cyan-400 mb-4">NHL (Hokej)</h2>
                <p class="text-slate-400 text-sm">Hokejovou sekci můžete upravovat stejným způsobem přes tlačítko Správa dat.</p>
            </div>
        </section>

    </main>

    <!-- ADMIN MODÁLNÍ OKNO -->
    <div id="admin-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-2xl w-full p-6 space-y-6 max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-700 pb-4">
                <h2 class="text-xl font-bold text-amber-400">⚙️ Správa a úprava výsledků</h2>
                <button onclick="toggleAdmin()" class="text-slate-400 hover:text-white font-bold text-xl">&times;</button>
            </div>

            <div class="space-y-4">
                <label class="block text-sm font-semibold text-slate-300">Vyberte ligu k úpravě:</label>
                <select id="admin-league-select" onchange="loadAdminData()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
                    <!-- Naplní se JS -->
                </select>

                <div class="border-t border-slate-700 pt-4">
                    <h3 class="font-bold text-emerald-400 mb-2">Upravit výsledky zápasů</h3>
                    <div id="admin-matches-editor" class="space-y-3"></div>
                </div>

                <div class="border-t border-slate-700 pt-4">
                    <h3 class="font-bold text-emerald-400 mb-2">Upravit střelce</h3>
                    <div id="admin-scorers-editor" class="space-y-3"></div>
                </div>
            </div>

            <div class="flex justify-end gap-3 border-t border-slate-700 pt-4">
                <button onclick="toggleAdmin()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg font-medium">Zavřít</button>
                <button onclick="saveAdminData()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg font-bold text-white">Uložit změny</button>
            </div>
        </div>
    </div>

    <!-- JavaScriptová logika -->
    <script>
        const defaultData = {
            'PL': {
                name: 'Anglie (Premier League)',
                matches: [
                    { home: 'Manchester City', away: 'Arsenal', homeScore: 2, awayScore: 2 },
                    { home: 'Liverpool', away: 'Chelsea', homeScore: 3, awayScore: 1 },
                    { home: 'Manchester United', away: 'Tottenham', homeScore: 1, awayScore: 0 }
                ],
                scorers: [
                    { name: 'Erling Haaland', team: 'Manchester City', goals: 10 },
                    { name: 'Cole Palmer', team: 'Chelsea', goals: 7 }
                ]
            },
            'PD': {
                name: 'Španělsko (La Liga)',
                matches: [
                    { home: 'Real Madrid', away: 'Barcelona', homeScore: 2, awayScore: 1 },
                    { home: 'Atletico Madrid', away: 'Villarreal', homeScore: 3, awayScore: 0 }
                ],
                scorers: [
                    { name: 'Kylian Mbappé', team: 'Real Madrid', goals: 9 },
                    { name: 'Robert Lewandowski', team: 'Barcelona', goals: 8 }
                ]
            },
            'BL1': {
                name: 'Německo (Bundesliga)',
                matches: [
                    { home: 'Bayern München', away: 'Dortmund', homeScore: 3, awayScore: 2 },
                    { home: 'RB Leipzig', away: 'Leverkusen', homeScore: 1, awayScore: 1 }
                ],
                scorers: [
                    { name: 'Harry Kane', team: 'Bayern München', goals: 11 }
                ]
            }
        };

        // Zde zajistíme, že se stará paměť ignoruje a načtou se čerstvá data
        let leaguesData = defaultData;
        let currentLeagueCode = 'PL';

        function switchTab(sport) {
            const fotbalSec = document.getElementById('sec-fotbal');
            const hokejSec = document.getElementById('sec-hokej');
            const btnFotbal = document.getElementById('btn-fotbal');
            const btnHokej = document.getElementById('btn-hokej');

            if (sport === 'fotbal') {
                fotbalSec.classList.remove('hidden');
                hokejSec.classList.add('hidden');
                btnFotbal.className = "px-3 py-1.5 bg-emerald-600 rounded-lg text-sm font-semibold transition hover:bg-emerald-500";
                btnHokej.className = "px-3 py-1.5 bg-slate-700 rounded-lg text-sm font-semibold transition hover:bg-slate-600";
            } else {
                fotbalSec.classList.add('hidden');
                hokejSec.classList.remove('hidden');
                btnHokej.className = "px-3 py-1.5 bg-cyan-600 rounded-lg text-sm font-semibold transition hover:bg-cyan-500";
                btnFotbal.className = "px-3 py-1.5 bg-slate-700 rounded-lg text-sm font-semibold transition hover:bg-slate-600";
            }
        }

        // Vykreslení tlačítek lig
        function renderLeagueButtons() {
            const container = document.getElementById('league-buttons');
            const selectContainer = document.getElementById('admin-league-select');
            
            if (!container || !selectContainer) return;

            container.innerHTML = '';
            selectContainer.innerHTML = '';

            Object.keys(leaguesData).forEach(code => {
                const league = leaguesData[code];
                const isActive = code === currentLeagueCode;
                
                // Hlavní tlačítka lig nahoře
                container.innerHTML += `
                    <button onclick="loadLeague('${code}')" class="league-btn px-3 py-1.5 text-sm rounded-lg font-medium transition ${isActive ? 'bg-emerald-600 text-white hover:bg-emerald-500' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}">
                        ${league.name}
                    </button>
                `;

                // Výběr v administračním okně
                selectContainer.innerHTML += `<option value="${code}" ${isActive ? 'selected' : ''}>${league.name}</option>`;
            });
        }

        // Načtení a výpočet ligy
        function loadLeague(leagueCode) {
            currentLeagueCode = leagueCode;
            renderLeagueButtons();

            const league = leaguesData[leagueCode];
            if (!league) return;

            document.getElementById('league-title').innerText = league.name;

            // 1. Zápasy
            const matchesContainer = document.getElementById('matches-container');
            matchesContainer.innerHTML = '';
            league.matches.forEach(m => {
                matchesContainer.innerHTML += `
                    <div class="p-3 bg-slate-700/50 rounded-lg flex justify-between items-center text-sm">
                        <span class="text-slate-200">${m.home} vs ${m.away}</span>
                        <span class="font-bold text-emerald-400 bg-slate-900 px-3 py-1 rounded">${m.homeScore} : ${m.awayScore}</span>
                    </div>
                `;
            });

            // 2. Výpočet tabulky
            const tableData = {};
            league.matches.forEach(m => {
                if (!tableData[m.home]) tableData[m.home] = { played: 0, pts: 0, gf: 0, ga: 0 };
                if (!tableData[m.away]) tableData[m.away] = { played: 0, pts: 0, gf: 0, ga: 0 };

                tableData[m.home].played++;
                tableData[m.away].played++;

                tableData[m.home].gf += Number(m.homeScore);
                tableData[m.home].ga += Number(m.awayScore);
                tableData[m.away].gf += Number(m.awayScore);
                tableData[m.away].ga += Number(m.homeScore);

                if (Number(m.homeScore) > Number(m.awayScore)) {
                    tableData[m.home].pts += 3;
                } else if (Number(m.homeScore) < Number(m.awayScore)) {
                    tableData[m.away].pts += 3;
                } else {
                    tableData[m.home].pts += 1;
                    tableData[m.away].pts += 1;
                }
            });

            const sortedTable = Object.keys(tableData).map(team => {
                return { team, ...tableData[team], gd: tableData[team].gf - tableData[team].ga };
            }).sort((a, b) => b.pts - a.pts || b.gd - a.gd);

            const standingsContainer = document.getElementById('standings-container');
            standingsContainer.innerHTML = '';
            sortedTable.forEach(row => {
                standingsContainer.innerHTML += `
                    <tr>
                        <td class="py-2.5 font-medium text-slate-200">${row.team}</td>
                        <td class="py-2.5 text-center text-slate-400">${row.played}</td>
                        <td class="py-2.5 text-center text-slate-400">${row.gf}:${row.ga}</td>
                        <td class="py-2.5 text-right font-bold text-emerald-400">${row.pts}</td>
                    </tr>
                `;
            });

            // 3. Střelci
            const scorersContainer = document.getElementById('scorers-container');
            scorersContainer.innerHTML = '';
            league.scorers.forEach(s => {
                scorersContainer.innerHTML += `
                    <tr>
                        <td class="py-2.5 font-medium text-slate-200">${s.name}</td>
                        <td class="py-2.5 text-slate-400">${s.team}</td>
                        <td class="py-2.5 text-right font-bold text-emerald-400">${s.goals}</td>
                    </tr>
                `;
            });
        }

        // Otevření/zavření administrace
        function toggleAdmin() {
            const modal = document.getElementById('admin-modal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                loadAdminData();
            }
        }

        // Načtení formulářů v administraci
        function loadAdminData() {
            const code = document.getElementById('admin-league-select').value;
            const league = leaguesData[code];

            const matchesDiv = document.getElementById('admin-matches-editor');
            matchesDiv.innerHTML = '';
            league.matches.forEach((m, index) => {
                matchesDiv.innerHTML += `
                    <div class="flex items-center justify-between bg-slate-900 p-2.5 rounded-lg text-sm gap-2">
                        <span class="text-slate-300 w-1/2 truncate">${m.home} vs ${m.away}</span>
                        <div class="flex items-center gap-1">
                            <input type="number" id="match-home-${index}" value="${m.homeScore}" class="w-12 bg-slate-800 border border-slate-700 text-center rounded p-1 text-white">
                            <span>:</span>
                            <input type="number" id="match-away-${index}" value="${m.awayScore}" class="w-12 bg-slate-800 border border-slate-700 text-center rounded p-1 text-white">
                        </div>
                    </div>
                `;
            });

            const scorersDiv = document.getElementById('admin-scorers-editor');
            scorersDiv.innerHTML = '';
            league.scorers.forEach((s, index) => {
                scorersDiv.innerHTML += `
                    <div class="flex items-center justify-between bg-slate-900 p-2.5 rounded-lg text-sm gap-2">
                        <span class="text-slate-300 w-1/2 truncate">${s.name} (${s.team})</span>
                        <input type="number" id="scorer-goals-${index}" value="${s.goals}" class="w-16 bg-slate-800 border border-slate-700 text-center rounded p-1 text-white">
                    </div>
                `;
            });
        }

        // Uložení změn z administrace
        function saveAdminData() {
            const code = document.getElementById('admin-league-select').value;
            const league = leaguesData[code];

            league.matches.forEach((m, index) => {
                const homeInput = document.getElementById(`match-home-${index}`);
                const awayInput = document.getElementById(`match-away-${index}`);
                if (homeInput && awayInput) {
                    m.homeScore = Number(homeInput.value);
                    m.awayScore = Number(awayInput.value);
                }
            });

            league.scorers.forEach((s, index) => {
                const goalsInput = document.getElementById(`scorer-goals-${index}`);
                if (goalsInput) {
                    s.goals = Number(goalsInput.value);
                }
            });

            toggleAdmin();
            loadLeague(currentLeagueCode);
        }

        // Spuštění při startu
        window.onload = function() {
            loadLeague('PL');
        };
    </script>
</body>
</html>

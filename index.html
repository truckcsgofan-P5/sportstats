<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportStats - Fotbal & Hokej Statistiky</title>
    <!-- Tailwind CSS pro moderní vzhled -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

    <!-- Hlavička -->
    <header class="bg-slate-800 border-b border-slate-700 shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-emerald-400">⚽🏒 SportStats</h1>
            <nav class="space-x-4">
                <button onclick="switchTab('fotbal')" id="btn-fotbal" class="px-4 py-2 bg-emerald-600 rounded-lg font-semibold transition hover:bg-emerald-500">Fotbal</button>
                <button onclick="switchTab('hokej')" id="btn-hokej" class="px-4 py-2 bg-slate-700 rounded-lg font-semibold transition hover:bg-slate-600">Hokej</button>
            </nav>
        </div>
    </header>

    <!-- Hlavní obsah -->
    <main class="max-w-6xl mx-auto px-4 py-8 space-y-8">

        <!-- FOTBALOVÁ SEKCE -->
        <section id="sec-fotbal" class="space-y-8">
            
            <!-- Výběr lig -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-wrap gap-2 items-center justify-between">
                <span class="text-slate-400 font-semibold text-sm">Vyberte ligu:</span>
                <div class="flex flex-wrap gap-2">
                    <button onclick="switchLeague('premier-league', 'Premier League', this)" class="league-btn px-3 py-1.5 bg-emerald-600 text-sm rounded-lg font-medium transition hover:bg-emerald-500">Anglie (PL)</button>
                    <button onclick="switchLeague('la-liga', 'La Liga', this)" class="league-btn px-3 py-1.5 bg-slate-700 text-sm rounded-lg font-medium transition hover:bg-slate-600">Španělsko</button>
                    <button onclick="switchLeague('bundesliga', 'Bundesliga', this)" class="league-btn px-3 py-1.5 bg-slate-700 text-sm rounded-lg font-medium transition hover:bg-slate-600">Německo</button>
                </div>
            </div>

            <!-- Živý widget pro výsledky a tabulku -->
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-emerald-400" id="widget-title">Živé výsledky & Zápasy: Premier League</h2>
                    <span class="text-xs bg-emerald-900/50 text-emerald-300 px-2.5 py-1 rounded-full border border-emerald-700 flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Živá data
                    </span>
                </div>
                
                <!-- Kontejner pro widget -->
                <div class="w-full overflow-hidden rounded-lg bg-slate-900 p-2 min-h-[550px]">
                    <!-- Premier League Widget -->
                    <div id="widget-premier-league" class="league-widget">
                        <iframe src="https://www.scoreaxis.com/widget/embed/premier-league?theme=dark" style="height:550px; width:100%; border:0;" scrolling="yes"></iframe>
                    </div>
                    <!-- La Liga Widget -->
                    <div id="widget-la-liga" class="league-widget hidden">
                        <iframe src="https://www.scoreaxis.com/widget/embed/la-liga?theme=dark" style="height:550px; width:100%; border:0;" scrolling="yes"></iframe>
                    </div>
                    <!-- Bundesliga Widget -->
                    <div id="widget-bundesliga" class="league-widget hidden">
                        <iframe src="https://www.scoreaxis.com/widget/embed/bundesliga?theme=dark" style="height:550px; width:100%; border:0;" scrolling="yes"></iframe>
                    </div>
                </div>
            </div>
        </section>

        <!-- HOKEJOVÁ SEKCE -->
        <section id="sec-hokej" class="space-y-8 hidden">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-cyan-400">Živé výsledky & Tabulka: NHL (Hokej)</h2>
                    <span class="text-xs bg-cyan-900/50 text-cyan-300 px-2.5 py-1 rounded-full border border-cyan-700 flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span> Živá data NHL
                    </span>
                </div>
                
                <!-- Hokejový widget -->
                <div class="w-full overflow-hidden rounded-lg bg-slate-900 p-2 min-h-[550px]">
                    <iframe src="https://www.scoreaxis.com/widget/embed/nhl?theme=dark" style="height:550px; width:100%; border:0;" scrolling="yes"></iframe>
                </div>
            </div>
        </section>

    </main>

    <!-- JavaScript pro přepínání -->
    <script>
        function switchTab(sport) {
            const fotbalSec = document.getElementById('sec-fotbal');
            const hokejSec = document.getElementById('sec-hokej');
            const btnFotbal = document.getElementById('btn-fotbal');
            const btnHokej = document.getElementById('btn-hokej');

            if (sport === 'fotbal') {
                fotbalSec.classList.remove('hidden');
                hokejSec.classList.add('hidden');
                btnFotbal.className = "px-4 py-2 bg-emerald-600 rounded-lg font-semibold transition hover:bg-emerald-500";
                btnHokej.className = "px-4 py-2 bg-slate-700 rounded-lg font-semibold transition hover:bg-slate-600";
            } else {
                fotbalSec.classList.add('hidden');
                hokejSec.classList.remove('hidden');
                btnHokej.className = "px-4 py-2 bg-cyan-600 rounded-lg font-semibold transition hover:bg-cyan-500";
                btnFotbal.className = "px-4 py-2 bg-slate-700 rounded-lg font-semibold transition hover:bg-slate-600";
            }
        }

        function switchLeague(leagueCode, leagueName, buttonElement) {
            document.querySelectorAll('.league-btn').forEach(btn => {
                btn.className = "league-btn px-3 py-1.5 bg-slate-700 text-sm rounded-lg font-medium transition hover:bg-slate-600";
            });
            buttonElement.className = "league-btn px-3 py-1.5 bg-emerald-600 text-sm rounded-lg font-medium transition hover:bg-emerald-500";

            document.getElementById('widget-title').innerText = `Živé výsledky & Zápasy: ${leagueName}`;

            document.querySelectorAll('.league-widget').forEach(widget => {
                widget.classList.add('hidden');
            });
            document.getElementById(`widget-${leagueCode}`).classList.remove('hidden');
        }
    </script>
</body>
</html>
